name: Deploy a InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validar sintaxis PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Verificar secrets FTP
        env:
          FTP_HOSTNAME: ${{ secrets.FTP_HOSTNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOSTNAME" || (echo "FTP_HOSTNAME está vacío" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME está vacío" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD está vacío" && exit 1)
          echo "Los tres secrets de FTP están disponibles."

      - name: Generar .env de producción
        run: |
          cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          EOF

      - name: Desplegar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /proyecto-agenda.freehosting.dev/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env.example
            **/db_schema.sql
            **/.atl/**
            **/README.md
            **/Thumbs.db
            **/.DS_Store
